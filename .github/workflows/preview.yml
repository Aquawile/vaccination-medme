# Builds the app on every push to these branches and publishes it to GitHub Pages,
# so the latest version is always one link away:
#   https://mayuunda.github.io/Medme-Vaccination/hotfix/   (hotfix/prd-implement)
#   https://mayuunda.github.io/Medme-Vaccination/staging/  (staging)
# One-time setup: repo Settings > Pages > Source: "Deploy from a branch", branch gh-pages, folder / (root).
name: preview

on:
  push:
    branches: [hotfix/prd-implement, staging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
        continue-on-error: ${{ github.ref_name == 'staging' && false || true }}
      - name: Unit tests
        run: pnpm exec vitest run
        if: ${{ hashFiles('vitest.config.ts') != '' }}
      - name: Pick folder
        id: dest
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then echo "dir=staging" >> "$GITHUB_OUTPUT"; else echo "dir=hotfix" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        run: pnpm exec vite build --base=/Medme-Vaccination/${{ steps.dest.outputs.dir }}/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
          commit_message: "preview: ${{ github.ref_name }} ${{ github.sha }}"
